name: app-build-dev-android-only

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 创建 dummy 签名文件，避免 build.gradle.kts 报 null
      - name: Create dummy keystore
        run: |
          mkdir -p simple_live_app/android
          touch /tmp/dummy.jks
          echo "storeFile=/tmp/dummy.jks" > simple_live_app/android/key.properties
          echo "storePassword=dummy" >> simple_live_app/android/key.properties
          echo "keyPassword=dummy" >> simple_live_app/android/key.properties
          echo "keyAlias=dummy" >> simple_live_app/android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK (debug)
        run: |
          cd simple_live_app
          flutter build apk --debug --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-*-debug.apk

      - run: echo "🍏 Android debug APK built successfully."
